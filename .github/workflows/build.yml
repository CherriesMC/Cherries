name: Cherries CI

on:
  push:
    branches: [ cherries/1.21.8 ]
    tags:
      - 'v*'
      - 'cherries-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: never
          cache-read-only: false

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "Cherries CI"

      - name: Set build number
        run: echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Apply patches
        run: ./gradlew applyAllPatches

      - name: Build server
        env:
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
        run: ./gradlew createMojmapLeavesclipJar

      - name: Prepare artifact
        run: |
          MC_VERSION=$(awk -F= '$1 == "mcVersion" { print $2 }' gradle.properties | tr -d '[:space:]')
          VERSION=$(awk -F= '$1 == "version" { print $2 }' gradle.properties | tr -d '[:space:]')
          SRC="leaves-server/build/libs/leaves-leavesclip-${VERSION}-mojmap.jar"
          JAR="cherries-${MC_VERSION}-${BUILD_NUMBER}.jar"
          test -f "$SRC"
          cp "$SRC" "$JAR"
          echo "JAR=$JAR" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.JAR }}
          path: ${{ env.JAR }}

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/') && github.repository == 'CherriesMC/Cherries'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.JAR }}
          generate_release_notes: true
