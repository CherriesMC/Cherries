name: Cherries Test CI

on:
  push:
    branches: [ cherries/1.21.8 ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: never
          cache-read-only: false

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "Cherries Test CI"

      - name: Apply patches
        run: ./gradlew applyAllPatches

      - name: Build server
        run: ./gradlew createMojmapLeavesclipJar

      - name: Move jar
        run: |
          VERSION=$(awk -F= '$1 == "version" { print $2 }' gradle.properties | tr -d '[:space:]')
          MC_VERSION=$(awk -F= '$1 == "mcVersion" { print $2 }' gradle.properties | tr -d '[:space:]')
          JAR="cherries-${MC_VERSION}-test.jar"
          cp "leaves-server/build/libs/leaves-leavesclip-${VERSION}-mojmap.jar" "$JAR"
          echo "JAR=$JAR" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.JAR }}
          path: ${{ env.JAR }}
